# this file uses prebuilt image in dockerhub
services:
  jekyll:
    image: amirpourmand/al-folio:latest
    build: .
    ports:
      - 8080:8080
      - 35729:35729
    volumes:
      - .:/srv/jekyll
    environment:
      - JEKYLL_ENV=development
    command: bash -c "cd /srv/jekyll && bundle install && bundle exec jekyll serve --host=0.0.0.0 --port=8080 --livereload --force_polling"